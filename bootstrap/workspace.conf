# workspace.conf — the workspace layout map, shared by every machine.
#
# Read by `wso` (bootstrap/wso.sh, bootstrap/_workspace.ps1). This file is
# TRACKED: it is the same on all machines, which is the whole point — the tree
# must be identical everywhere so muscle memory and scripts port between boxes.
#
# Per-machine overrides go in an UNTRACKED twin, which is read second and wins
# key-by-key:
#     POSIX    ~/.config/terminal-stack/workspace.local.conf
#     Windows  %LOCALAPPDATA%\terminal-stack\workspace.local.conf
#
# Format: whitespace-separated `<directive> <key> <value>`. Blank lines and
# lines starting with # are ignored. Deliberately not JSON — bash cannot parse
# JSON without jq, and this stays diffable and greppable.
#
#   org     <owner>       <tier>   repos owned by <owner> land in <tier>/
#   rename  <old>         <new>    owner was renamed upstream; treat old as new
#   set     <key>         <value>  scalar settings (see below)
#
# Settings:
#   default_tier    tier for any owner with no `org` line          [public]
#   archive_days    default staleness threshold for `wso archive`  [90]
#   scheme_own      remote scheme for owners listed above:
#                     ssh | https | preserve                       [ssh]
#   scheme_public   remote scheme for everyone else                [preserve]
#   host_default    host assumed for `wso get owner/repo`   [github.com]

# ---- owners you control -----------------------------------------------------
org       37metrics            src
org       dimension42ai        src
org       martybytes           src
org       moleculardesigns     src

# ---- upstream owner renames -------------------------------------------------
# GitHub redirects the old URL, so clones keep working and nothing announces the
# change. Without this line a martsamp77 clone would file itself under a
# martsamp77/ directory forever.
rename    martsamp77           martybytes

# ---- settings ---------------------------------------------------------------
set       default_tier         public
set       archive_days         90
set       scheme_own           ssh
set       scheme_public        preserve
set       host_default         github.com
