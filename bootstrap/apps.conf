# apps.conf -- the CLI tool catalog, shared by every reader.
#
# Read by bootstrap/_config.sh (bash), bootstrap/_config.ps1 (pwsh) and
# tstack/apps.py (Python). It exists because there were two copies kept in
# agreement by hand, and a third reader was needed: the settings dashboard, the
# wizard and `tstack config apps` all have to know what the catalog contains, and
# only one of those is bash.
#
# Whitespace-delimited, deliberately NOT JSON -- bash cannot parse JSON without
# jq, and this stays diffable. Same convention and reasoning as
# bootstrap/workspace.conf and tstack/commands.conf. ASCII only: Python reads
# this and prints it, and a Windows console on codepage 437 renders anything else
# as mojibake.
#
#   <id>  <group>  <classes>  <platforms>  <description...>
#
# group      which section of the picker it appears in. `ai` is the install ROUTE
#            as well as a category -- its members go to ts_install_ai_cli rather
#            than to a package manager, which is why llmfit is in `models`.
# classes    which machine class pre-ticks it:
#              both  a laptop and a server
#              dev   only where you write code  (runtimes, agents, Python tools)
#              sys   only where you administer  (monitors, disk, network)
#              none  offered, never pre-ticked
#            The two default sets are DERIVED from this, so they cannot drift
#            apart the way two hand-maintained lists did.
# platforms  where it can actually be installed:
#              all    everywhere
#              posix  macOS, Linux and WSL -- no Windows package exists
#              linux  Linux only (nvtop needs NVIDIA on Linux)
#              windows  Windows only
#            This is "can this platform install it", NOT "is it in winget". The
#            two used to be conflated, which is why a Windows box missing
#            grok/gemini/pi/cursor-agent was never once told so.
# description  the rest of the line, `#` included. Shown in the picker.
#
# Adding a tool: add a row. Nothing else needs editing -- not the group list, not
# the recommended set, not the sysadmin set, and none of the three readers.
# `tests/test_apps_catalog.py` asserts all three agree on every field.

tmux          shell     both  posix    terminal multiplexer (ssht, persistent sessions)
eza           shell     both  all      modern ls (icons, git status)
bat           shell     both  all      cat with syntax highlighting
tree          shell     both  posix    directory tree as text
zoxide        shell     both  all      smarter cd (z)
fzf           shell     both  all      fuzzy finder (Ctrl+R, Ctrl+T)
atuin         shell     both  all      SQLite shell history, better Ctrl+R (opt-in)

ripgrep       search    both  all      fast recursive grep (rg)
fd            search    both  all      fast, friendly find (the WezTerm sessionizer needs it)

duf           disk      both  all      modern df - colourful disk free
ncdu          disk      both  posix    interactive disk usage TUI
dust          disk      both  all      du with a tree view, sorted by size
gdu           disk      sys   all      very fast disk usage TUI (ncdu alternative)

btop          system    both  all      resource monitor (CPU, memory, disk, net, procs)
bottom        system    sys   all      alternative system monitor (btm)
glances       system    sys   all      cross-platform system monitor
nvtop         system    sys   linux    GPU process monitor (NVIDIA hosts)
lazydocker    system    sys   posix    docker TUI (docker hosts)

bandwhich     network   sys   posix    which process is using the bandwidth
gping         network   sys   all      ping with a live graph
rclone        network   sys   all      sync/mount 70+ storage backends, SMB shares included (tstack smb)

delta         git       both  all      git diff pager
gh            git       both  all      GitHub CLI (org enumeration for wso)
ghq           git       dev   all      clone into the derived workspace path
lazygit       git       both  all      git TUI (the wso status hand-off)

micro         editors   both  all      nano-like terminal editor
neovim        editors   both  all      neovim editor (nvim)
glow          editors   both  all      terminal markdown renderer
zed           editors   none  all      Zed GUI editor
tldr          editors   sys   posix    concise command examples
prettymark    editors   both  windows  markdown viewer (Windows)
yazi          editors   sys   all      terminal file manager (y to cd on exit)

fnm           runtimes  dev   all      fast Node version manager (reads .nvmrc; ~10ms shell cost)
node          runtimes  none  all      Node.js itself, without a version manager

python        python    dev   all      Python 3 interpreter
uv            python    dev   all      fast Python package/project manager
pipx          python    dev   all      install Python CLI tools in isolated envs
ruff          python    dev   all      Python linter + formatter, one fast binary
ipython       python    dev   all      a far better Python REPL
httpie        python    none  all      friendly HTTP client (readable curl)
poetry        python    none  all      Python project/dependency manager
pre-commit    python    none  all      run git hooks before every commit

claude        ai        dev   all      Claude Code CLI (cc/ccd wrappers drive it)
codex         ai        dev   all      OpenAI Codex CLI (cx/cy wrappers drive it)
cursor-agent  ai        dev   all      Cursor's CLI agent
grok          ai        dev   all      xAI Grok CLI (standalone binary; no Node needed)
gemini        ai        dev   all      Google Gemini CLI
pi            ai        dev   all      Pi coding agent (earendil-works; needs Node 22+)

llmfit        models    none  posix    which local LLM fits this machine's RAM and GPU
