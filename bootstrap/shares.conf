# shares.conf — defaults for `tstack smb`, shared by every machine.
#
# Read by `tstack smb` (bootstrap/ts-smb.sh, bootstrap/_smb.sh). This file is
# TRACKED, so it holds DEFAULTS ONLY and never a real host: the repo must not
# learn your NAS hostnames, share names or usernames.
#
# Your actual shares go in an UNTRACKED twin, which is read second and wins
# key-by-key — even for a single field of a stanza defined here:
#     POSIX    ~/.config/terminal-stack/shares.local.conf
# See shares.local.conf.example for the shape.
#
# Format: whitespace-separated `<directive> <key> <value>`. Blank lines and
# lines starting with # are ignored. Deliberately not JSON — bash cannot parse
# JSON without jq, and this stays diffable and greppable.
#
#   set    <key>   <value>   a default (see below)
#   share  <alias> opens a stanza; the fields below bind to it until the next
#                  `share` or `set` line. Indentation is cosmetic.
#
# Fields inside a `share` stanza:
#   host        the SMB server            (required)
#   path        the share on that host, optionally with a subdirectory
#               (required) — NOTE this is `path`, not `share`, because `share`
#               opens a stanza. `path Media` or `path Media/Movies`.
#   mountpoint  where to mount it         [<mount_root>/<alias>]
#   user        SMB user                  [default_user]
#   domain      SMB domain/workgroup      [default_domain]
#   port        SMB port                  [445]
#   cred        keychain | rclone | file | prompt | none   [default_cred]
#   engine      auto | fuse | nfs         [default_engine]
#   vfs         off | minimal | writes | full              [default_vfs]
#   remote      use this existing rclone.conf remote verbatim instead of an
#               on-the-fly connection string
#   flags       extra rclone flags, free-form to end of line. This is the ONLY
#               field that may contain spaces; a flag VALUE containing a space
#               is not supported.
#
# There is deliberately NO `password` field. This file and its local twin are
# plaintext by construction, and a password field would invite one. `cred`
# names a backend; the secret lives there. See `tstack smb creds`.

# ---- settings ---------------------------------------------------------------
set   mount_root       ~/mnt
set   default_engine   auto
set   default_vfs      off
set   default_user     guest
set   default_domain   WORKGROUP
set   default_cred     keychain
set   discovery_sweep  off

# ---- example (commented: never ship a real host in the tracked file) --------
# share media
#   host       nas.lan
#   path       Media
#   user       marty
#   cred       keychain
#   mountpoint ~/mnt/media
#   flags      --transfers 8 --smb-idle-timeout 5m
