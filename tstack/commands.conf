# tstack subcommand registry — the single source of truth for the command surface.
#
# Read by four consumers: tstack/registry.py, the `tstack` shim in dot_zshrc, the
# `Invoke-Tstack` shim in $PROFILE, and the completion providers in both shells.
# One table means `tstack --help` renders identically on every platform by
# construction, replacing the manual pty diff in docs/verifying-changes.md § 3.
#
# Whitespace-delimited, deliberately NOT JSON — bash cannot parse JSON without jq,
# and this stays diffable. Same convention and same reasoning as
# bootstrap/workspace.conf.
#
#   <name>  <posix-impl>  <windows-impl>  <summary...>
#
# Implementation tokens:
#
#   python          run tstack/main.py <name> — this subcommand has been ported
#   @Name           call Name in the CURRENT shell session (a zsh function, or a
#                   pwsh function living inside $PROFILE). Used for anything not
#                   yet ported and for anything that must mutate the calling
#                   shell, which a child process cannot do.
#   path/to/x.sh    run with bash, from the clone
#   path/to/x.ps1   run with pwsh -File, from the clone
#   -               not supported on this platform; the shim says so plainly
#                   rather than reporting "not found"
#
# THE PORT WORKS BY EDITING THIS FILE. When a subsystem moves to Python, flip both
# implementation columns to `python` and delete the two shell files. Nothing else
# changes: not the dispatcher, not the help text, not the completions.
#
# Ordered as `tstack --help` prints it: daily drivers first, then wiring.
#
# `config` is the one row whose columns differ on purpose. The POSIX side is the
# ported Python (tstack/commands/config.py), which delegates `apps`, `tts` and
# `reconfigure` to bootstrap/ts-config.sh -- those end in a package-manager
# install or the bootstrap's save sequence, and REVAMP-PLAN.md lists the
# installer entry points as never ported. The Windows side stays on
# Set-TerminalStackConfig until it can be exercised on a Windows machine: it is
# the most-used command in the stack, and flipping it blind is how you find out
# on someone else's morning.

update       @_tstack_update              @Update-TerminalStack         pull and apply the latest stack
rollback     @_tstack_rollback            @Restore-TerminalStack        undo the last update
doctor       python                       python                        diagnose problems, and repair them
config       python                       @Set-TerminalStackConfig      view and change saved settings
ui           python                       python                        every setting, in one screen
services     python                       python                        docker service stacks
mux          python                       python                        the WezTerm mux domain
wezterm      python                       python                        WezTerm channel and updates
ghostty      python                       -                             the managed Ghostty config
herdr        python                       python                        the managed herdr config
wizard       python                       python                        the install questionnaire
smb          bootstrap/ts-smb.sh          -                             rclone SMB shares
agents       python                       python                        agent CLI wiring
agentmemory  bootstrap/ts-agentmemory.sh  bootstrap/ts-agentmemory.ps1  agentmemory harness wiring
doc          @doc                         @doc                          the knowledge base
