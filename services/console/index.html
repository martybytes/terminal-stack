<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Agent007Memory — real-time intelligence for AI-agent memory activity."
    />
    <meta name="theme-color" content="#00072d" id="theme-color" />
    <title>Agent007Memory</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
    />
    <script>
      (() => {
        let theme = "dark";
        try {
          const saved = JSON.parse(localStorage.getItem("agent007memory.preferences.v1") || "null");
          theme = saved?.theme === "light" || saved?.theme === "system" ? saved.theme : "dark";
        } catch {}
        const resolved = theme === "system" && matchMedia("(prefers-color-scheme: light)").matches ? "light" : theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.background = resolved === "light" ? "#eef2f8" : "#00072d";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
