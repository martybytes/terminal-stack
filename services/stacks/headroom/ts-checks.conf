# ts-checks.conf — health and reachability for the headroom stack.
#
# The proxy builds locally on a first run, which is why it gets 180s rather than
# the 60s its healthcheck alone would suggest.
#
# The Qdrant and Neo4j checks are NOT here: those two only run when
# `memoryBackend` is `headroom`, and they are asserted by ts-checks.memory.conf,
# which ts-stack loads alongside the docker-compose.memory.yml overlay.
health   ts-headroom-proxy        healthy   180  -
health   ts-headroom-dashboard    healthy   60   -
# /readyz is a genuine readiness endpoint, so 2xx is the right test here. The
# token-protected surface is checked by ts-verify.sh, which needs the secret.
http-ok  readyz                   2xx       10   http://127.0.0.1:8787/readyz
