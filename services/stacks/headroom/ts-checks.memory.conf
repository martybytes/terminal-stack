# ts-checks.memory.conf — the Qdrant + Neo4j datastores.
#
# Loaded only when docker-compose.memory.yml is in this stack's COMPOSE_FILE,
# which is to say only when `memoryBackend` is `headroom`. ts-stack pairs a
# `docker-compose.<x>.yml` overlay with a `ts-checks.<x>.conf` of the same name;
# there is no registry.
#
# These lines lived in ts-checks.conf, where they asserted two databases were
# healthy on every machine — true, and completely uninformative, since nothing
# had ever written to them.
#
# neo4j is a JVM with a 45s start_period and five 30s retries, so 240s is its
# real worst case, not a guess.
health   ts-headroom-neo4j        healthy   240  -
health   ts-headroom-qdrant       healthy   120  -
port     qdrant-rest              loopback  5    6333
port     neo4j-browser            loopback  5    7474
