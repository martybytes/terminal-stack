# agent007memory — the console and transparent proxy in front of AgentMemory.
# https://github.com/martybytes/agent007memory (its source is services/console/)
#
# Its OWN compose project, deliberately. It is a separate application with a
# separate lifecycle -- a UI you rebuild while the memory server keeps running --
# and as an overlay on the agentmemory project it showed up in Docker as a
# second row under someone else's name. Now `docker ps`, Docker Desktop and
# `tstack services status` all name it for what it is.
#
# What it does: a transparent proxy on host 3111 in front of agentmemory (live
# request feed, per-host /_agent/<name> attribution) and the console UI + /api +
# /ws + /healthz on 3114. It changes nothing about agentmemory: it talks only to
# the REST API and the mem-live stream. Without it running, MCP clients hit the
# server directly on the bypass port 3110 and there is no UI.
#
# Two couplings to the agentmemory stack, both explicit below: it joins that
# stack's network to reach the server by name, and it reads agentmemory's HMAC
# secret from that stack's data volume, read-only. `ts-after` makes tstack services
# start agentmemory first, because an external network cannot be joined before
# it exists.
name: ts-agent007memory

services:
  console:
    container_name: ts-agent007memory
    image: ts-agent007memory:local
    # This image only ever exists locally, so compose must not try a registry
    # first: it printed "pull access denied for ts-agent007memory" on every up,
    # built the image anyway, and still exited non-zero -- so `tstack services up`
    # reported a failure over a stack that had just started cleanly.
    pull_policy: build
    build:
      # The console's source is in this repo, so the build context is a relative
      # path and what runs is always what you have checked out. It used to be a
      # pinned commit SHA of a separate repo, which made every console change a
      # push -> re-pin the SHA here -> rebuild cycle (what update-console.* did).
      # The trade is that a dirty tree builds a dirty image; `git status` before
      # `tstack services up` is the whole discipline.
      context: ../../console
      dockerfile: Dockerfile
    restart: unless-stopped
    # No depends_on: it cannot reach across compose projects. `ts-after` makes
    # tstack services start agentmemory first, and the proxy tolerates an upstream that
    # is not answering yet -- it returns errors until it is, and recovers on its
    # own, which is what `restart: unless-stopped` is for.
    ports:
      - "127.0.0.1:3111:3111"   # transparent proxy -> agentmemory:3111 (what MCP clients hit)
      - "127.0.0.1:3114:3114"   # console UI + /api + /ws + /healthz
    # Generated by configure-openai-billing.ps1. Contains identifiers, mount
    # paths, and masked key fingerprints only — never either OpenAI key itself.
    # It also carries LLM_API_KEY_HINT and LLM_ADMIN_KEY_HINT (see the display
    # mirrors below); those arrive here as an env_file rather than through the
    # environment: block on purpose, because an environment: entry would
    # override them with "" on any deploy that omits --env-file.
    env_file:
      - path: .billing.env
        required: false
    environment:
      # HOST must be 0.0.0.0 inside the container for the same reason as
      # AGENTMEMORY_VIEWER_HOST above -- a container-internal loopback bind is
      # unreachable through any port mapping, on any platform. The host side
      # stays loopback-only via the ports: mappings.
      HOST: "0.0.0.0"
      # The container NAME, not the service name. `agentmemory` is a network
      # alias compose attaches within its own project; the container name is the
      # alias that is guaranteed to resolve from another project on the same
      # network, which is what this now is.
      UPSTREAM_HTTP: "http://ts-agentmemory-server:3111"
      UPSTREAM_WS: "ws://ts-agentmemory-server:3112"
      # Safe, display-only mirrors for the LLM Calls page. Deliberately do not
      # pass OPENAI_API_KEY (or any provider secret) into the console.
      #
      # These interpolate from compose's env-file, which is NOT the same thing
      # as the env_file: keys above: passing only `--env-file .billing.env`
      # replaces .env as the interpolation source and every mirror below
      # resolves to "". Always deploy with both, .env first:
      # `tstack services` assembles that list for you from `ts-envfiles` and any
      # .billing.env present, always with the interpolation sources in order.
      #
      # The masked key fingerprints the console displays (LLM_API_KEY_HINT,
      # LLM_ADMIN_KEY_HINT) are not listed here — they come from .billing.env,
      # written by configure-openai-billing.ps1. First six characters and last
      # four; the keys themselves still never enter the console.
      # Provider labels, not behaviour: set LLM_PROVIDER_LABEL /
      # LLM_ENDPOINT_LABEL in .env when the endpoint is not OpenAI, or the
      # console's LLM page keeps naming a provider this stack no longer calls.
      # Defaults preserve the OpenAI wording for an unconfigured clone.
      LLM_PROVIDER: "${LLM_PROVIDER_LABEL:-OpenAI}"
      LLM_ENDPOINT_LABEL: "${LLM_ENDPOINT_LABEL:-OpenAI API}"
      LLM_MODEL: "${OPENAI_MODEL:-}"
      LLM_BASE_URL: "${OPENAI_BASE_URL:-}"
      LLM_TIMEOUT_MS: "${AGENTMEMORY_LLM_TIMEOUT_MS:-}"
      LLM_MAX_TOKENS: "${MAX_TOKENS:-}"
      LLM_SUMMARIZE_CONCURRENCY: "${SUMMARIZE_CHUNK_CONCURRENCY:-}"
      LLM_SUMMARY_MAX_OBSERVATIONS: "${AGENTMEMORY_SUMMARY_MAX_OBSERVATIONS:-}"
      LLM_CONCURRENCY: "${AGENTMEMORY_LLM_CONCURRENCY:-}"
      LLM_COMPRESSION_MODEL: "${AGENTMEMORY_COMPRESSION_MODEL:-}"
      LLM_COMPRESSION_MAX_TOKENS: "${AGENTMEMORY_COMPRESSION_MAX_TOKENS:-}"
      LLM_GRAPH_BATCH_SIZE: "${GRAPH_EXTRACTION_BATCH_SIZE:-}"
      LLM_AUTO_SUMMARIZE: "${AGENTMEMORY_AUTO_SUMMARIZE:-}"
      LLM_AUTO_SUMMARY_MIN_NEW: "${AGENTMEMORY_AUTO_SUMMARY_MIN_NEW_OBSERVATIONS:-}"
      LLM_AUTO_GRAPH_MIN_NEW: "${AGENTMEMORY_AUTO_GRAPH_MIN_NEW_OBSERVATIONS:-}"
      LLM_AUTO_GRAPH_MAX_PER_RUN: "${AGENTMEMORY_AUTO_GRAPH_MAX_OBSERVATIONS_PER_RUN:-}"
      LLM_QUEUE_NAME: "${AGENTMEMORY_LLM_QUEUE:-agentmemory-llm}"
      LLM_RECOVERY_BATCH_SIZE: "${AGENTMEMORY_LLM_RECOVERY_BATCH_SIZE:-25}"
      LLM_EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-}"
      # Optional project-scoped authoritative cost reconciliation.
      # OPENAI_ADMIN_KEY_FILE is an in-container read-only path supplied by
      # the billing overlay; the inference key never enters the console.
      # Two hours is both the default and enforced minimum cooldown.
      OPENAI_BILLING_SYNC_MS: "${OPENAI_BILLING_SYNC_MS:-7200000}"
      # Aggregate-only reporting history owned by Agent007Memory. This is a
      # separate SQLite database and never touches AgentMemory's state store.
      HISTORY_DB_PATH: "/data/agent007memory.sqlite"
      HISTORY_RETENTION_DAYS: "365"
      # The console's own API calls (memory totals, timeline cache) read the
      # HMAC straight from agentmemory's volume, read-only — no secret in any
      # tracked file or .env, and rotation self-heals (re-read on 401).
      SECRET_FILE: "/upstream-data/.hmac"
    volumes:
      - ts-agentmemory-data:/upstream-data:ro
      - ts-agentmemory-console-history:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3114/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # The agentmemory stack's network, joined rather than created: this container
  # has to resolve ts-agentmemory-server by name. External means compose will
  # NOT create it -- if agentmemory has never been up, `up` fails here with a
  # clear "network not found" rather than starting a console that can reach
  # nothing. ts-after handles the ordering for `tstack services up`.
  default:
    name: ts-agentmemory-net
    external: true

volumes:
  # agentmemory's data volume, mounted READ-ONLY for one file: the HMAC secret
  # at /upstream-data/.hmac. No secret in any tracked file or .env, and rotation
  # self-heals because the console re-reads on a 401.
  ts-agentmemory-data:
    external: true
  # Console-owned aggregate reporting database. Kept under its agentmemory-era
  # name: renaming it would mean migrating a year of reporting history to buy
  # nothing. External protects it from `docker compose down -v`.
  ts-agentmemory-console-history:
    external: true
