# ts-checks.conf — health and reachability for the agent007memory console.
#
#   kind    id                 expect   secs  target
#   health  <container>        healthy  <n>   -
#   http-ok <id>               2xx      <n>   <url>      (strictly 2xx)
#   port    <id>               loopback <n>   <port>     (published, 127.0.0.1 only)
#
# 3111 is checked here and 3110 in the agentmemory stack, deliberately: if 3110
# answers and 3111 does not, this stack is down and agentmemory is fine, and
# splitting the checks the same way the projects are split is what makes the two
# verdicts distinguishable at a glance.
health   ts-agent007memory        healthy   180  -
http-ok  proxy-livez              2xx       10   http://127.0.0.1:3111/agentmemory/livez
http-ok  console-healthz          2xx       10   http://127.0.0.1:3114/healthz
port     proxy                    loopback  5    3111
port     ui                       loopback  5    3114
