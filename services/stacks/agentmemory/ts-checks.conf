# ts-checks.conf — health and reachability for the agentmemory stack.
#
#   kind    id                 expect   secs  target
#   health  <container>        healthy  <n>   -
#   http    <id>               <code>   <n>   <url>      (any response = reachable)
#   http-ok <id>               2xx      <n>   <url>      (strictly 2xx)
#   port    <id>               loopback <n>   <port>     (published, and 127.0.0.1 only)
#
# Deadlines come from the compose healthcheck they mirror: start_period plus
# interval x retries, and agentmemory's first run BUILDS, which is why it gets
# 300s rather than the 60s its healthcheck alone would suggest.
health   ts-agentmemory-server    healthy   300  -
health   ts-agentmemory-console   healthy   120  -
# 3110 is the server's own API. Check it BEFORE the console proxy on 3111: if
# 3110 answers and 3111 does not, the console is down, not agentmemory.
http-ok  server-livez             2xx       10   http://127.0.0.1:3110/agentmemory/livez
http-ok  console-livez            2xx       10   http://127.0.0.1:3111/agentmemory/livez
http-ok  console-healthz          2xx       10   http://127.0.0.1:3114/healthz
port     viewer                   loopback  5    3113
