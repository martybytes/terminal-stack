# ts-checks.conf — health and reachability for the kokoro TTS stack.
#
# 600s on a first run: the model download is the slow part, not the container.
# RestartCount is checked by ts-verify.sh, because kokoro's documented failure
# (a CUDA build that does not match the card) reports Up while crash-looping --
# "Up (healthy)" is not evidence for this service.
health   ts-kokoro-tts            healthy   600  -
http-ok  docs                     2xx       15   http://127.0.0.1:8880/docs
